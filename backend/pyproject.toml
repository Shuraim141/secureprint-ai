[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
# B008: FastAPI's Depends()/Query() in argument defaults is the framework's intended pattern.
"app/api/*" = ["B008"]

[tool.bandit]
exclude_dirs = ["tests"]
