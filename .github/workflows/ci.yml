name: CI

# Real checks that must pass on every push/PR: the same pytest, ruff, bandit, pip-audit,
# npm test, npm run build and npm audit commands already run by hand throughout development.
# No step is decorative; a failing step fails the workflow.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest, ruff, bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Security scan (bandit)
        working-directory: backend
        run: bandit -q -r app

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Unit and API tests (pytest)
        working-directory: backend
        # conftest.py sets JWT_SECRET/MASTER_KEY/DATABASE_URL etc. directly in the environment
        # before the app is imported, so no .env file is needed to run the test suite.
        run: python -m pytest -v

  frontend:
    name: Frontend (vitest, build, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit and component tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Dependency vulnerability scan (npm audit)
        working-directory: frontend
        run: npm audit
